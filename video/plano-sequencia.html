<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rangify, plano sequência</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/jetbrains-mono/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource/instrument-serif/400-italic.css">
<style>
  /*
    Vídeo "plano sequência" do Rangify (40 s, 1920x1080), na sequência do vídeo de referência:
    1) o problema: um convite no Discord, a malta junta-se e o jogo perde-se;
    2) o Rangify: uma linha laranja, câmara sempre a seguir, por fila, draft, mapas, código e resultado.
    Tudo é desenhado em função do tempo (desenhar(t)), por isso cada fotograma é exato.
    A música e os efeitos são sintetizados aqui (Web Audio), sem ficheiros de som.
    Abrir no browser: Reproduzir. Gravar o MP4: node scripts/gravar-video.mjs --pagina=plano-sequencia pt
  */
  html, body { margin: 0; height: 100%; background: #050506; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Geist Variable', Geist, system-ui, sans-serif; color: #f3f0eb; }
  #palco { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #09090b; flex-shrink: 0; }
  .mono { font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace; }
  .serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; }
  .abs { position: absolute; }
  #fundo { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #luzes { position: absolute; inset: 0; background: radial-gradient(60% 50% at 12% 8%, rgba(255,91,31,0.10), transparent 70%), radial-gradient(50% 45% at 92% 96%, rgba(255,91,31,0.07), transparent 70%); }
  #camara { position: absolute; inset: 0; perspective: 1900px; }
  #mundo { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; transform-origin: 0 0; }
  .cartao { position: absolute; border-radius: 26px; background: #111114; border: 1.5px solid rgba(255,255,255,0.1); overflow: hidden; box-sizing: border-box; }
  .cartao.vivo { box-shadow: 0 0 0 1px rgba(255,91,31,0.25), 0 40px 120px -30px rgba(255,91,31,0.55); }
  .esqueleto { position: absolute; border-radius: 18px; background: #151518; border: 1.5px solid rgba(255,255,255,0.09); box-sizing: border-box; padding: 22px 24px; }
  .barra-esq { height: 12px; border-radius: 6px; background: rgba(255,255,255,0.08); margin-top: 14px; }
  .etiqueta { position: absolute; background: #ff5b1f; color: #170802; font-family: 'JetBrains Mono Variable', monospace; font-weight: 700; font-size: 22px; letter-spacing: 0.08em; padding: 6px 12px; white-space: nowrap; }
  .porta { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: #09090b; border: 4px solid #ff5b1f; box-sizing: border-box; box-shadow: 0 0 18px rgba(255,91,31,0.8); }
  .linha-texto { overflow: hidden; display: block; }
  .linha-texto > span { display: block; will-change: transform; }
  .grande { font-weight: 900; text-transform: uppercase; letter-spacing: -0.045em; line-height: 0.92; }
  .pilula { height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.16); font-family: 'JetBrains Mono Variable', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.08em; display: inline-flex; align-items: center; color: #8a857e; background: rgba(9,9,11,0.7); }
  .pilula.ativa { background: #ff5b1f; color: #170802; border-color: #ff5b1f; }
  .linha-ui { display: flex; align-items: center; gap: 16px; padding: 16px 26px; border-top: 1.5px solid rgba(255,255,255,0.06); }
  .chip { height: 38px; padding: 0 16px; border-radius: 11px; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .chip.botao { background: #ff5b1f; color: #170802; }
  .chip.ok { border: 1.5px solid rgba(255,91,31,0.45); background: rgba(255,91,31,0.12); color: #ffb592; }
  .chip.vazio { border: 1.5px solid rgba(255,255,255,0.14); color: #a8a29b; }
  .ini { display: inline-flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono Variable', monospace; font-weight: 700; flex-shrink: 0; }
  #comecar { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(5,5,6,0.82); z-index: 20; }
  #comecar button { height: 54px; padding: 0 28px; border-radius: 14px; border: 0; background: #ff5b1f; color: #170802; font: 800 18px 'Geist Variable', sans-serif; cursor: pointer; }
  #comecar span { font-size: 14px; color: #a8a29b; }
</style>
</head>
<body>
<div id="palco">
  <img id="fundo" alt="">
  <div id="luzes"></div>
  <div id="camara"><div id="mundo"></div></div>
  <div id="ruido" class="abs" style="inset: 0; pointer-events: none"></div>
  <div id="ecra" class="abs" style="inset: 0; pointer-events: none"></div>
  <div id="glitch" class="abs" style="inset: 0; pointer-events: none"></div>
  <div id="clarao" class="abs" style="inset: 0; background: #f3f0eb; opacity: 0; pointer-events: none"></div>
  <div id="flash" class="abs" style="inset: 0; background: #ff5b1f; opacity: 0; pointer-events: none"></div>
  <div id="final" class="abs" style="inset: 0; opacity: 0; pointer-events: none"></div>
  <div class="mono abs" style="right: 44px; bottom: 30px; font-size: 13px; letter-spacing: 0.16em; color: rgba(255,255,255,0.32)">RANGIFY · DADOS ILUSTRATIVOS</div>
</div>
<div id="comecar"><button type="button" id="botao">Reproduzir</button><span>Com som. 40 segundos.</span></div>

<script>
// ===================================================================== utilidades
const FPS = 30
const TOTAL = 39.6
const MODO = new URLSearchParams(location.search).get('modo')
const $ = (s, r = document) => r.querySelector(s)
const $$ = (s, r = document) => [...r.querySelectorAll(s)]
const limitar = (v, a, b) => Math.max(a, Math.min(b, v))
const prog = (t, a, b) => limitar((t - a) / (b - a), 0, 1)
const misturar = (a, b, p) => a + (b - a) * p
const suave = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2)
const sair = (p) => 1 - Math.pow(1 - p, 3)
const salto = (p) => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2) }
function aleatorio(semente) {
  let a = semente >>> 0
  return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296 }
}
const LOGO = (cor = '#ff5b1f') => `<svg aria-hidden="true" viewBox="12 18 57 42" style="width:100%;height:100%"><path d="M23 19.5H66.25L55 35.4H67.5L40 58.75L51.25 41.25H40.25L50.6 28H27C24 28 22 30.5 22 33.75C22 37 24 39.75 27 39.75H38.2L23.1 58.5H13.1L23.1 46.25C17 46.25 13.5 40.5 13.5 33C13.5 25.5 17.5 19.5 23 19.5Z" fill="${cor}"/></svg>`
const NOME = (px, cor = '#ff5b1f') => `<span style="font-size:${px}px;line-height:1;letter-spacing:-0.045em;color:${cor};white-space:nowrap"><b style="font-weight:800">Rang</b><span class="serif" style="font-size:1.2em">ify</span></span>`
const mundo = $('#mundo'), ecra = $('#ecra')
function no(pai, html) { const d = document.createElement('div'); d.innerHTML = html.trim(); const e = d.firstElementChild; pai.appendChild(e); return e }
const mini = (m) => `../public/mapas/mini/${m.toLowerCase()}.webp`

// ===================================================================== o fundo (o mesmo do vídeo anterior)
const FIOS = [
  ['M 1180 -60 C 1215 70 1300 150 1470 178 C 1650 208 1782 196 1806 108 C 1822 46 1798 -12 1772 -60', 90, 13, 2.6, '#ffe4d2'],
  ['M -60 90 C 160 104 330 222 362 398 C 388 534 338 640 232 712 C 132 780 44 838 -60 950', 86, 12, 2.4, '#ffe4d2'],
  ['M 120 1140 C 300 1000 520 948 720 990 C 880 1024 980 1080 1090 1150', 80, 11, 2.2, '#ffd9c2'],
  ['M 1960 520 C 1840 610 1806 750 1866 870 C 1904 946 1950 994 1990 1100', 56, 7, 1.5, '#ffc8a8'],
]
const svgFundo = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<defs><filter id="n" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
<radialGradient id="l1" cx="0.12" cy="0.1" r="0.55"><stop offset="0" stop-color="#ff5b1f" stop-opacity="0.13"/><stop offset="1" stop-color="#ff5b1f" stop-opacity="0"/></radialGradient>
<radialGradient id="l2" cx="0.92" cy="0.95" r="0.5"><stop offset="0" stop-color="#ff5b1f" stop-opacity="0.08"/><stop offset="1" stop-color="#ff5b1f" stop-opacity="0"/></radialGradient></defs>
<rect width="1920" height="1080" fill="#09090b"/><rect width="1920" height="1080" fill="url(#l1)"/><rect width="1920" height="1080" fill="url(#l2)"/>
<g fill="none" stroke-linecap="round">${FIOS.map(([d, n, b, c, cor]) => `<path d="${d}" stroke="#ff5b1f" stroke-width="${n}" stroke-opacity="0.13" filter="url(#n)"/><path d="${d}" stroke="#ff5b1f" stroke-width="${b}" stroke-opacity="0.8" filter="url(#b)"/><path d="${d}" stroke="${cor}" stroke-width="${c}" stroke-opacity="0.9"/>`).join('')}</g></svg>`
$('#fundo').src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgFundo)

// ===================================================================== o mundo
// Ato 1: o convite (C0) e o caminho que se perde.
const C0 = { x: 0, y: 0, w: 460, h: 640 }
const PROB = [
  { id: 'lobby', x: 1000, nome: 'LOBBY', tag: 'JOGADORES: 7/10', tTag: 3.15 },
  { id: 'equipas', x: 1700, nome: 'EQUIPAS', tag: 'QUEM ESCOLHE?', tTag: 4.35 },
  { id: 'resultado', x: 2400, nome: 'RESULTADO', tag: 'QUEM GANHOU?', tTag: 5.95 },
]
const YP = -230

// Ato 2: os cinco passos, em escada.
const PASSOS = [
  { id: 'fila', x: 1700, y: 300, h: 372, n: '01', nome: 'FILA', l1: 'ENTRA NA FILA.', l2: '10 JOGADORES.', sub: 'Da tua região e com o Riot ID ligado. Quando a sala enche, tens 20 segundos para aceitar.', ini: 12.0, fim: 15.0 },
  { id: 'draft', x: 3250, y: 0, h: 372, n: '02', nome: 'DRAFT', l1: 'DOIS CAPITÃES.', l2: 'UM DRAFT.', sub: 'Os dois ranks oficiais mais altos são capitães e escolhem à vez, 15 segundos por escolha.', ini: 15.9, fim: 19.3 },
  { id: 'mapas', x: 4800, y: 320, h: 392, n: '03', nome: 'MAPAS', l1: 'BANE ATÉ', l2: 'SOBRAR UM.', sub: 'Os capitães banem à vez da rotação da temporada. O último mapa é o da partida.', ini: 20.1, fim: 23.1 },
  { id: 'codigo', x: 6350, y: 20, h: 410, n: '04', nome: 'CÓDIGO', l1: 'O CÓDIGO,', l2: 'SÓ PARA OS 10.', sub: 'O Capitão A cria o grupo e partilha o código. A partida ganha um chat e uma call por equipa.', ini: 24.0, fim: 28.0 },
  { id: 'resultado', x: 7900, y: 300, h: 380, n: '05', nome: 'RESULTADO', l1: 'A API CONFIRMA.', l2: 'A TABELA SOBE.', sub: 'O resultado e as estatísticas vêm da Henrik Dev API. O Rangify Score dá até 6 pontos a mais.', ini: 28.9, fim: 32.2 },
]
const LARG = 620

// --- convite no Discord
no(mundo, `
<div id="c0" class="cartao" style="left:${C0.x - C0.w / 2}px;top:${C0.y - C0.h / 2}px;width:${C0.w}px;height:${C0.h}px;border-radius:30px">
  <div style="display:flex;align-items:center;gap:14px;padding:20px 22px;background:#0d0d10">
    <span class="ini" style="width:44px;height:44px;border-radius:50%;background:#2a1d17;color:#ffd5bf;font-size:17px">NY</span>
    <span style="display:flex;flex-direction:column;gap:2px"><b style="font-size:19px">Nyx</b><span style="font-size:14px;color:#8a857e">#geral · hoje às 20:41</span></span>
  </div>
  <div style="height:388px;background:linear-gradient(160deg,#ff7a3d 0%,#ff5b1f 45%,#c23a0c 100%);padding:30px 30px 0;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between">
    <div class="grande" style="font-size:66px;color:#170802">Alguém para<br>um 5v5<br>hoje?</div>
    <div class="mono" style="font-size:15px;font-weight:700;letter-spacing:0.14em;color:rgba(23,8,2,0.7);padding-bottom:22px">MENSAGEM · DISCORD</div>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:26px 24px">
    <span style="display:flex;flex-direction:column;gap:4px"><b style="font-size:20px">Custom às 21h</b><span style="font-size:15px;color:#8a857e">7 de 10 responderam</span></span>
    <span id="bora" class="chip botao" style="height:50px;padding:0 24px;font-size:19px;border-radius:13px">Bora</span>
  </div>
</div>`)

// --- caminho do ato 1 (branco, como quem não sabe para onde vai)
const ESPESSURA = 4
no(mundo, `
<svg id="svg1" style="position:absolute;left:0;top:0;overflow:visible" width="1" height="1">
  <polyline id="l1" points="230,215 430,215 430,${YP} 1000,${YP}" fill="none" stroke="#f3f0eb" stroke-width="${ESPESSURA}" stroke-linejoin="round"/>
  <line id="l1b" x1="1340" y1="${YP}" x2="1700" y2="${YP}" stroke="#f3f0eb" stroke-width="${ESPESSURA}"/>
  <line id="l1c" x1="2040" y1="${YP}" x2="2400" y2="${YP}" stroke="#f3f0eb" stroke-width="${ESPESSURA}" stroke-dasharray="22 16"/>
  <line id="l1d" x1="2740" y1="${YP}" x2="3040" y2="${YP}" stroke="#f3f0eb" stroke-width="${ESPESSURA}" stroke-dasharray="22 16"/>
</svg>`)
for (const c of PROB) {
  no(mundo, `<div id="p-${c.id}" class="esqueleto" style="left:${c.x}px;top:${YP - 100}px;width:340px;height:200px">
    <div class="mono" style="font-size:17px;font-weight:700;letter-spacing:0.14em;color:#8a857e">${c.nome}</div>
    <div class="barra-esq" style="width:78%"></div><div class="barra-esq" style="width:92%"></div><div class="barra-esq" style="width:60%"></div><div class="barra-esq" style="width:70%"></div>
  </div>`)
  no(mundo, `<div id="tag-${c.id}" class="etiqueta" style="left:${c.x + 10}px;top:${YP - 152}px">${c.tag}</div>`)
}
no(mundo, `<div id="interrogacao" class="abs grande" style="left:3080px;top:${YP - 150}px;font-size:300px;color:#ff5b1f">?</div>`)
no(mundo, `<div id="ponto1" class="abs" style="width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;box-shadow:0 0 22px 6px rgba(255,255,255,0.65)"></div>`)

// --- caminho do ato 2 (laranja e luminoso)
const CAMINHO = [[230, 215], [570, 215], [570, PASSOS[0].y], [PASSOS[0].x - LARG / 2, PASSOS[0].y]]
PASSOS.forEach((p, i) => {
  CAMINHO.push([p.x + LARG / 2, p.y])
  const prox = PASSOS[i + 1]
  if (prox) { const vx = p.x + LARG / 2 + 90; CAMINHO.push([vx, p.y], [vx, prox.y], [prox.x - LARG / 2, prox.y]) }
  else CAMINHO.push([p.x + LARG / 2 + 230, p.y])
})
const COMPRIMENTOS = [0]
for (let i = 1; i < CAMINHO.length; i++) COMPRIMENTOS.push(COMPRIMENTOS[i - 1] + Math.hypot(CAMINHO[i][0] - CAMINHO[i - 1][0], CAMINHO[i][1] - CAMINHO[i - 1][1]))
const COMP_TOTAL = COMPRIMENTOS[COMPRIMENTOS.length - 1]
const ate = (indice) => COMPRIMENTOS[indice]
// Onde a linha chega a cada porta: entrada do passo i = índice 3 + 4i, saída = 4 + 4i.
const entrada = (i) => ate(3 + 4 * i), saida = (i) => ate(4 + 4 * i)
const pontos2 = CAMINHO.map((p) => p.join(',')).join(' ')
no(mundo, `
<svg id="svg2" style="position:absolute;left:0;top:0;overflow:visible" width="1" height="1">
  <polyline id="l2halo" points="${pontos2}" fill="none" stroke="#ff5b1f" stroke-width="18" stroke-opacity="0.28" stroke-linejoin="round" style="filter:blur(8px)"/>
  <polyline id="l2" points="${pontos2}" fill="none" stroke="#ff7a3d" stroke-width="${ESPESSURA + 1}" stroke-linejoin="round"/>
</svg>`)

// --- os textos e os cartões de cada passo
const cartoes = {}
PASSOS.forEach((p, i) => {
  no(mundo, `<div id="txt-${p.id}" class="abs" style="left:${p.x - LARG / 2 - 760}px;top:${p.y - 236}px;width:720px">
    <div class="mono eyebrow" style="font-size:19px;font-weight:700;letter-spacing:0.16em;color:#ff8a5b;height:30px"></div>
    <div class="grande" style="font-size:76px;margin-top:14px;white-space:nowrap"><span class="linha-texto"><span>${p.l1}</span></span><span class="linha-texto"><span style="color:#ff5b1f">${p.l2}</span></span></div>
    <p class="sub" style="margin:92px 0 0;font-size:25px;line-height:1.45;color:#a8a29b;width:600px">${p.sub}</p>
  </div>`)
  no(mundo, `<div class="porta" style="left:${p.x - LARG / 2}px;top:${p.y}px"></div>`)
  no(mundo, `<div class="porta" style="left:${p.x + LARG / 2}px;top:${p.y}px"></div>`)
  no(mundo, `<div id="rot-${p.id}" class="abs" style="left:${p.x - LARG / 2}px;top:${p.y + p.h / 2 + 50}px;width:${LARG}px;opacity:0">
    <div class="mono" style="font-size:64px;font-weight:700;color:#ff5b1f">${p.n}</div>
    <div class="grande" style="font-size:150px">${p.nome}</div>
  </div>`)
  cartoes[p.id] = no(mundo, `<div id="cartao-${p.id}" class="cartao" style="left:${p.x - LARG / 2}px;top:${p.y - p.h / 2}px;width:${LARG}px;height:${p.h}px"></div>`)
})
no(mundo, `<div id="fim-check" class="abs" style="left:${CAMINHO[CAMINHO.length - 1][0] - 40}px;top:${CAMINHO[CAMINHO.length - 1][1] - 40}px;width:80px;height:80px;border-radius:50%;background:#ff5b1f;display:flex;align-items:center;justify-content:center;opacity:0;box-shadow:0 0 50px rgba(255,91,31,0.8)"><svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="#170802" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>`)
no(mundo, `<div id="ponto2" class="abs" style="width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff3ea;box-shadow:0 0 26px 9px rgba(255,91,31,0.85);opacity:0"></div>`)

const cab = (titulo, direita) => `<div style="display:flex;align-items:center;justify-content:space-between;padding:22px 26px 18px"><b style="font-size:22px;letter-spacing:-0.01em">${titulo}</b><span class="mono" style="font-size:14px;color:#8a857e;letter-spacing:0.08em">${direita}</span></div>`
// 01 · Fila
cartoes.fila.innerHTML = cab('Pronto para jogar', 'RANGIFY HUB · EU') + `
  <div class="linha-ui"><span class="ini" style="width:48px;height:48px;border-radius:13px;background:rgba(255,91,31,0.14);color:#ff8a5b;font-size:16px">ID</span>
    <span style="flex:1;display:flex;flex-direction:column;gap:3px"><b style="font-size:19px">Riot ID</b><span style="font-size:15px;color:#8a857e">Nyx#4521 · Diamante 2</span></span>
    <span id="f-riot" class="chip botao">Ligar</span></div>
  <div class="linha-ui"><span class="ini" style="width:48px;height:48px;border-radius:13px;background:rgba(255,91,31,0.14);color:#ff8a5b;font-size:16px">DC</span>
    <span style="flex:1;display:flex;flex-direction:column;gap:3px"><b style="font-size:19px">Discord</b><span style="font-size:15px;color:#8a857e">Servidor do Rangify</span></span>
    <span id="f-discord" class="chip botao">Entrar</span></div>
  <div class="linha-ui" style="flex-direction:column;align-items:stretch;gap:12px">
    <span style="display:flex;justify-content:space-between;font-size:16px;color:#d0cbc4"><span>À procura de jogadores · EU</span><span id="f-n" class="mono" style="font-weight:700">0/10</span></span>
    <span style="height:10px;border-radius:5px;background:rgba(255,255,255,0.07);overflow:hidden"><span id="f-barra" style="display:block;height:100%;width:0;background:#ff5b1f;box-shadow:0 0 16px rgba(255,91,31,0.7)"></span></span>
    <span id="f-encontrada" style="display:flex;align-items:center;justify-content:space-between;opacity:0"><span class="mono" style="font-size:15px;font-weight:700;letter-spacing:0.14em;color:#ff8a5b">PARTIDA ENCONTRADA · 20 S</span><span id="f-aceitar" class="chip botao">Aceitar</span></span>
  </div>`
// 02 · Draft
const DRAFT = [['Cometa', 'Duelista · Diam 3', 'A'], ['Lumi', 'Iniciador · Diam 2', 'B'], ['Pedra', 'Sentinela · Diam 1', 'A'], ['Hugo', 'Controlador · Plat 3', 'B']]
cartoes.draft.innerHTML = cab('Draft · RG-4821', 'CAPITÃO A · NYX') + `

// ===================================================================== tocar, fotografar e codificar
async function preparar() {
  await document.fonts.ready
  await Promise.all(MAPAS.map((m) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = mini(m) })))
}
async function tocar() {
  await preparar()
  const ctx = new AudioContext({ sampleRate: 48000 }); await ctx.resume()
  const t0 = ctx.currentTime + 0.3
  criarSom(ctx, ctx.destination, t0)
  const passo = () => { const s = ctx.currentTime - t0; desenhar(Math.max(0, Math.min(TOTAL, s))); if (s < TOTAL) requestAnimationFrame(passo) }
  requestAnimationFrame(passo)
}
async function somCompleto() {
  const ctx = new OfflineAudioContext(2, Math.ceil(48000 * (TOTAL + 0.2)), 48000)
  criarSom(ctx, ctx.destination, 0)
  return ctx.startRendering()
}
async function codificar(total) {
  if (!window.Mp4Muxer) await new Promise((r, f) => { const sc = document.createElement('script'); sc.src = '../node_modules/mp4-muxer/build/mp4-muxer.js'; sc.onload = r; sc.onerror = f; document.head.appendChild(sc) })
  const { Muxer, ArrayBufferTarget } = window.Mp4Muxer
  const video = { codec: 'avc1.640028', width: 1920, height: 1080, bitrate: 10_000_000, framerate: FPS }
  let audio = { codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: 2, bitrate: 192_000 }, codecMux = 'aac'
  if (!(await AudioEncoder.isConfigSupported(audio)).supported) { audio = { ...audio, codec: 'opus' }; codecMux = 'opus' }
  const alvo = new ArrayBufferTarget()
  const mux = new Muxer({ target: alvo, video: { codec: 'avc', width: 1920, height: 1080, frameRate: FPS }, audio: { codec: codecMux, sampleRate: 48000, numberOfChannels: 2 }, fastStart: 'in-memory', firstTimestampBehavior: 'offset' })
  const ve = new VideoEncoder({ output: (c, m) => mux.addVideoChunk(c, m), error: (e) => { throw e } })
  ve.configure({ ...video, latencyMode: 'quality', avc: { format: 'avc' } })
  for (let i = 0; i < total; i++) {
    const bmp = await createImageBitmap(await (await fetch(`/quadros/${i}.jpg`)).blob())
    const f = new VideoFrame(bmp, { timestamp: Math.round((i * 1e6) / FPS), duration: Math.round(1e6 / FPS) })
    ve.encode(f, { keyFrame: i % (FPS * 2) === 0 }); f.close(); bmp.close()
    while (ve.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 5))
  }
  await ve.flush()
  const som = await somCompleto()
  const ae = new AudioEncoder({ output: (c, m) => mux.addAudioChunk(c, m), error: (e) => { throw e } })
  ae.configure(audio)
  const esq = som.getChannelData(0), dir = som.getChannelData(1), amostras = Math.min(som.length, Math.round((total / FPS) * 48000))
  for (let i = 0; i < amostras; i += 4800) {
    const n = Math.min(4800, amostras - i), d = new Float32Array(n * 2); d.set(esq.subarray(i, i + n), 0); d.set(dir.subarray(i, i + n), n)
    ae.encode(new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round((i * 1e6) / 48000), data: d }))
  }
  await ae.flush(); mux.finalize()
  const r = await fetch('/guardar?nome=rangify-plano-pt.mp4', { method: 'POST', body: alvo.buffer })
  return r.ok ? `mp4 ${(alvo.buffer.byteLength / 1e6).toFixed(1)} MB (${codecMux})` : 'erro ao guardar'
}

function ajustar() { $('#palco').style.zoom = MODO ? 1 : Math.min(innerWidth / 1920, innerHeight / 1080) }
ajustar(); addEventListener('resize', ajustar)
desenhar(0)
if (MODO) {
  $('#comecar').remove()
  document.body.style.alignItems = 'flex-start'; document.body.style.justifyContent = 'flex-start'
  window.iniciarQuadros = async () => { await preparar(); desenhar(0); return Math.round(TOTAL * FPS) }
  window.quadro = (i) => desenhar(i / FPS)
  window.codificar = codificar
} else {
  window.irPara = (s) => desenhar(s)
  $('#botao').onclick = () => { $('#comecar').remove(); tocar() }
}
