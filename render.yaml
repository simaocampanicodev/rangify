# Render Blueprint: o Rangify como site estático.
# As variáveis do Supabase ficam com `sync: false`: o Render pede-as ao criar o serviço.
services:
  - type: web
    name: rangify
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # SPA: /perfil/Nyx-4521 não existe como ficheiro, por isso tudo abre o index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Os ficheiros de /assets têm o conteúdo no nome (o Vite muda-o a cada alteração): podem ficar um ano no browser.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /maps/*
        name: Cache-Control
        value: public, max-age=604800, immutable
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
