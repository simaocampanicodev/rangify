# Só o que o Rangify muda em relação ao padrão do Supabase CLI.
project_id = "rangify"

# O login por utilizador é chamado antes de haver sessão.
[functions.entrar]
verify_jwt = false

[functions.discord-partida]
# Chamada pela base de dados (pg_net) com um segredo no cabeçalho, não por utilizadores.
verify_jwt = false

[functions.twitch-sincronizar]
# Chamada pela base de dados (pg_cron + pg_net) com o mesmo segredo do Discord.
verify_jwt = false

[functions.twitch-ligar]
# O GET de retorno vem da Twitch, pelo browser, sem token; o POST confirma a sessão dentro da função.
verify_jwt = false

[functions.processar-torneio]
# A base de dados chama-a a cada minuto (pg_cron + pg_net) com o segredo do Discord; os jogadores chamam-na com a sessão e ela confirma-a por dentro.
verify_jwt = false
